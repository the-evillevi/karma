<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#141413;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#836953;text-decoration:none}a:hover{color:#141413}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<script src="karma-data.js"></script>
</helmet>
<div style="min-height:100vh;display:flex;justify-content:center;padding:24px 12px">
<div data-screen-label="Comanda móvil" style="width:390px;max-width:100%;background:#f0eee6;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:760px">
<div style="background:#faf9f5;border-bottom:1px solid #e2e0d6;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;z-index:10">
<div style="display:flex;align-items:baseline;gap:10px">
<span style="font-family:Georgia,serif;font-style:italic;font-size:23px;line-height:1;color:#141413">Karma</span>
<span style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6b6a63;font-weight:500">Comanda · Cocina y barra</span>
<span style="{{ connStyle }}">{{ connLabel }}</span>
</div>
<div style="display:flex;gap:6px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<button style="{{ t.style }}" onClick="{{ t.pick }}">{{ t.label }}<sc-if value="{{ t.hasCount }}" hint-placeholder-val="{{ false }}"> · {{ t.count }}</sc-if></button>
</sc-for>
</div>
</div>
<div style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px">
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding:56px 20px;text-align:center;color:#6b6a63;font-size:13.5px;border:1px dashed #e2e0d6;border-radius:14px">Sin comandas en este estado.<br>Las órdenes nuevas del punto de venta aparecerán aquí.</div>
</sc-if>
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
<div style="background:#faf9f5;border:1px solid #e2e0d6;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:rise .25s ease">
<div style="display:flex;align-items:center;gap:8px">
<span style="font-size:15px;font-weight:500;color:#141413">{{ c.folio }}</span>
<span style="{{ c.prepStyle }}">{{ c.prepLabel }}</span>
<span style="margin-left:auto;font-size:12px;color:#6b6a63">{{ c.time }}</span>
</div>
<div style="font-size:12px;color:#6b6a63">{{ c.meta }}</div>
<div style="display:flex;flex-direction:column">
<sc-for list="{{ c.items }}" as="i" hint-placeholder-count="2">
<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #e2e0d6;align-items:flex-start">
<span style="font-size:15px;font-weight:500;color:#141413;flex:none;min-width:28px">{{ i.qty }}×</span>
<div style="flex:1;min-width:0">
<div style="font-size:14.5px;font-weight:500;color:#141413;line-height:1.3">{{ i.name }}</div>
<sc-if value="{{ i.hasMods }}" hint-placeholder-val="{{ false }}"><div style="font-size:12.5px;color:#6b6a63;margin-top:2px">{{ i.mods }}</div></sc-if>
<sc-if value="{{ i.hasNotes }}" hint-placeholder-val="{{ false }}"><div style="font-size:12.5px;color:#836953;margin-top:2px;font-weight:500">“{{ i.notes }}”</div></sc-if>
</div>
</div>
</sc-for>
</div>
<sc-if value="{{ c.hasAction }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ c.advance }}" style="{{ c.actionStyle }}">{{ c.actionLabel }}</button>
</sc-if>
</div>
</sc-for>
</div>
<div style="background:#faf9f5;border-top:1px solid #e2e0d6;padding:12px 18px;display:flex;align-items:center;gap:10px">
<span style="font-size:12px;color:#6b6a63;flex:1">{{ footNote }}</span>
<a href="Karma POS.dc.html" style="font-size:12.5px;font-weight:500">Ir a la caja →</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: this.load(), tab: 'todas', online: true };
  }
  load() {
    try {
      const v = JSON.parse(localStorage.getItem('karma-pos-v1')) || {};
      if (v.open) { this._online = v.online !== false; return v.open; }
    } catch (e) {}
    this._online = true;
    return (window.KARMA ? window.KARMA.seedOrders : []).map(o => ({ ...o }));
  }
  save(open) {
    try {
      const v = JSON.parse(localStorage.getItem('karma-pos-v1')) || {};
      v.open = open;
      localStorage.setItem('karma-pos-v1', JSON.stringify(v));
    } catch (e) {}
  }
  componentDidMount() {
    this._l = e => { if (e.key === 'karma-pos-v1') this.setState({ open: this.load(), online: this._online }); };
    window.addEventListener('storage', this._l);
    this._p = setInterval(() => this.setState({ open: this.load(), online: this._online }), 4000);
    this.setState({ online: this._online });
  }
  componentWillUnmount() { window.removeEventListener('storage', this._l); clearInterval(this._p); }
  renderVals() {
    const s = this.state;
    const acc = '#836953', tint = '#f6e5df', paper = '#faf9f5', ink = '#141413', mut = '#6b6a63', line = '#e2e0d6', bg = '#f0eee6';
    const tag = (b, c) => ({ fontSize: 11, fontWeight: 500, padding: '3px 8px', borderRadius: 999, background: b, color: c, whiteSpace: 'nowrap' });
    const prepTags = { 'en-cola': ['En cola', bg, mut], preparando: ['Preparando', tint, acc], listo: ['Listo', acc, paper], entregado: ['Entregado', bg, mut] };
    const typeLabel = t => ({ local: 'En local', mesa: 'Mesa', llevar: 'Para llevar', domicilio: 'Domicilio', recoger: 'Recoger' })[t] || t;
    const next = { 'en-cola': ['preparando', 'Empezar preparación'], preparando: ['listo', 'Marcar listo'], listo: ['entregado', 'Marcar entregado'] };
    const order = { 'en-cola': 0, preparando: 1, listo: 2, entregado: 3 };
    const visible = s.open.filter(o => o.prep !== 'entregado');
    const counts = { todas: visible.length, 'en-cola': 0, preparando: 0, listo: 0 };
    visible.forEach(o => { if (counts[o.prep] != null) counts[o.prep] += 1; });
    const list = (s.tab === 'todas' ? visible : visible.filter(o => o.prep === s.tab)).slice().sort((a, b) => (order[a.prep] || 0) - (order[b.prep] || 0));
    return {
      connLabel: s.online ? 'En línea' : 'Sin conexión',
      connStyle: { marginLeft: 'auto', ...tag(s.online ? tint : ink, s.online ? acc : paper) },
      tabs: [['todas', 'Todas'], ['en-cola', 'En cola'], ['preparando', 'Preparando'], ['listo', 'Listas']].map(([id, label]) => ({
        label, hasCount: counts[id] > 0, count: counts[id],
        style: { padding: '7px 12px', borderRadius: 999, fontSize: 12.5, fontWeight: 500, cursor: 'pointer', border: '1px solid ' + (s.tab === id ? acc : line), background: s.tab === id ? acc : paper, color: s.tab === id ? paper : ink, whiteSpace: 'nowrap' },
        pick: () => this.setState({ tab: id })
      })),
      empty: list.length === 0,
      cards: list.map(o => {
        const pt = prepTags[o.prep] || prepTags['en-cola'];
        const nx = next[o.prep];
        return {
          folio: o.folio, time: o.time,
          prepLabel: pt[0], prepStyle: tag(pt[1], pt[2]),
          meta: typeLabel(o.type) + ' · ' + o.ref + ' · ' + o.user,
          items: o.items.map(i => ({ qty: i.qty, name: i.name, mods: i.modsText, hasMods: !!i.modsText, notes: i.notes, hasNotes: !!i.notes })),
          hasAction: !!nx,
          actionLabel: nx ? nx[1] : '',
          actionStyle: { padding: '13px', minHeight: 46, background: o.prep === 'preparando' ? acc : paper, color: o.prep === 'preparando' ? paper : ink, border: o.prep === 'preparando' ? 'none' : '1px solid ' + line, borderRadius: 10, fontSize: 14, fontWeight: 500, cursor: 'pointer', width: '100%' },
          advance: () => {
            const open = this.state.open.map(x => x.folio === o.folio ? { ...x, prep: nx[0] } : x);
            this.setState({ open });
            this.save(open);
          }
        };
      }),
      footNote: visible.length + ' comandas activas — se actualiza sola desde la caja'
    };
  }
}
</script>
</body>
</html>
